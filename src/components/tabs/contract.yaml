html:
  element: ds-tabs
  attributes:
    activation: [manual, automatic]
  children:
    - '[role="tablist"] > button[role="tab"]'
    - '[role="tabpanel"]'
aria:
  tablist: aria-label or aria-labelledby
  tab: [id, aria-controls, aria-selected, tabindex]
  tabpanel: [id, aria-labelledby]
figma:
  masters: [Tabs, Tabs / Trigger]
  slots:
    Tabs: [Tabs / Trigger]
    Content: visible panel composition
  preview: [State]
rules:
  - Tabs has two or more tabs and exactly one enabled selected tab.
  - Each tab explicitly pairs with one panel through aria-controls and aria-labelledby.
  - The component owns selection, roving focus, keyboard navigation, and panel visibility.
  - Manual activation is the default; automatic activation is opt-in only for local, instant panels.
  - Parent owns inline size; Tabs and panels fill it while tabs hug their labels.
  - A disabled tab is not focusable or selectable.
  - A tab button is type="button"; it never submits a surrounding form.
  - Initialize every non-selected panel with hidden so it cannot flash before the custom element upgrades.
  - Give a text-only panel tabindex="0" so keyboard users can reach its content.
  - Parent layout owns a stable panel region when changing panels must not move surrounding content.
