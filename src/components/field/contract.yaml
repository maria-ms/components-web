html:
  pattern: label + one supported form control + optional message
aria:
  aria-describedby: visible supporting or error message
figma:
  preview: [State, Show message]
  slots:
    Control: [Text Input, Textarea, Select, Number Input]
rules:
  - Accept exactly one supported form control.
  - Figma Control is restricted to approved assets; on the Web it contains exactly one native input, select, or textarea.
  - The child owns its native value, validity, focus, disabled state, and Size.
  - Parent owns inline size; Field and its one slotted control fill available inline size.
