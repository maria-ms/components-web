html:
  element: progress
  attributes: [value, max]
aria:
  aria-label: accessible name when no visible label exists
  aria-labelledby: visible label
figma:
  preview: [Size, Value]
rules:
  - Value is a Figma preview; code uses native value and max.
  - Use only for determinate completion; use Spinner or Skeleton when duration is unknown.
  - Parent owns label, announced status, and inline size; Progress fills available inline size.
  - The surrounding region may own aria-busy and aria-describedby.
