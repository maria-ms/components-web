html:
  element: fieldset
  children: [legend, "same-name input[type=radio]"]
aria:
  aria-describedby: group error when present
figma:
  preview: [State, Show description]
  slots:
    Options: [Choice Field with Radio]
rules:
  - Radio Group owns missing-selection error, never Radio or Choice Field.
  - Parent owns inline size; Radio Group, its Options area, and Choice Field rows fill available inline size while Radios remain intrinsic.
