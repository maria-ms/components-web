html:
  element: details
  children: [summary, body...]
aria:
  native: summary names and controls its disclosure
figma:
  preview: [Open, State]
  slots:
    Body: unrestricted expanded-panel content
rules:
  - Use only inside Accordion Items.
  - Header maps to summary; Body maps to one or more direct children after summary.
  - For multiple or rich Body elements, use one wrapper that owns their spacing.
  - Body content may contain arbitrary valid flow content.
  - Open and State are Figma previews, not Web Component APIs.
  - Accordion owns dividers between its Items.
  - Focus styling belongs on summary:focus-visible.
