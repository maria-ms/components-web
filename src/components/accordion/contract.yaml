html:
  children: [details]
aria:
  native: details and summary disclosure semantics
figma:
  slots:
    Items: [Accordion / Item]
rules:
  - Accordion keeps zero or one direct Item open.
  - Each Item is one direct details child with a summary followed by one or more Body children. For multiple or rich Body elements, use one wrapper that owns their spacing.
  - Accordion owns dividers; the final Item has none.
  - Accordion fills its parent; Items fill the Items Slot and opening an Item changes height only.
